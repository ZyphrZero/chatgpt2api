[package]
name = "web-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
gloo-file = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Document",
  "Event",
  "File",
  "FileList",
  "FormData",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "Location",
  "Navigator",
  "Url",
  "Window",
] }
yew = { version = "0.21", features = ["csr"] }
